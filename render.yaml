# AGRITAIRE on Render.
#
# A dashboard "Web Service" created with the Python defaults runs:
#   Build: pip install -r requirements.txt
#   Start: gunicorn your_application.wsgi
# This repo now includes those files. The blueprint also builds the Vite
# game so gunicorn can serve dist/.
services:
  - type: web
    name: agritaire
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && npm ci --include=dev && npm run build
    startCommand: bash start.sh
    healthCheckPath: /
    previews:
      generation: automatic
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: PYTHON_VERSION
        value: '3.13.4'
